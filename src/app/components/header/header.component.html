<header class="site-header">
  <div class="site-container nav-shell">
    <a class="brand" href="#home" aria-label="TheVolkner — inicio" (click)="closeMenu()">
      <span class="brand-copy">Omar Arvelo <strong>(TheVolkner)</strong><small>FULL-STACK DEVELOPER</small></span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      [class.is-open]="menuOpen"
      [attr.aria-expanded]="menuOpen"
      aria-controls="site-navigation"
      [attr.aria-label]="i18n.text('Abrir menú', 'Open menu')"
      (click)="menuOpen = !menuOpen"
    >
      <span></span><span></span>
    </button>

    <nav id="site-navigation" class="navigation" [class.is-open]="menuOpen">
      <a href="#about" (click)="closeMenu()">{{ i18n.text('Sobre mí', 'About') }}</a>
      <a href="#skills" (click)="closeMenu()">{{ i18n.text('Habilidades', 'Skills') }}</a>
      <a href="#work" (click)="closeMenu()">{{ i18n.text('Proyectos', 'Work') }}</a>
      <a href="#contact" (click)="closeMenu()">{{ i18n.text('Contacto', 'Contact') }}</a>
    </nav>

    <div class="language-switch" role="group" [attr.aria-label]="i18n.text('Seleccionar idioma', 'Select language')">
      <button type="button" [class.active]="i18n.lang === 'es'" (click)="setLanguage('es')">ES</button>
      <span></span>
      <button type="button" [class.active]="i18n.lang === 'en'" (click)="setLanguage('en')">EN</button>
    </div>
  </div>
</header>
